<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Dependency Risk Monitor</mat-card-title>
      <mat-card-subtitle>Assess open-source dependency risks</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p class="description">
        Track the health and security of your dependencies with our comprehensive analysis tool.
      </p>
    </mat-card-content>

    <mat-card-actions>
      <button 
        mat-raised-button 
        color="primary" 
        (click)="login()"
        [disabled]="isLoading()"
        class="login-button">
        <span *ngIf="!isLoading()">
          Login with GitHub
        </span>
        <span *ngIf="isLoading()" class="loading-container">
          <mat-progress-spinner
            diameter="20"
            mode="indeterminate"
            class="spinner">
          </mat-progress-spinner>
          Redirecting...
        </span>
      </button>
    </mat-card-actions>
  </mat-card>
</div>
